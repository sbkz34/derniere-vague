name: Build APK

# Exports the Android APK with Godot and publishes it as a release, so the latest build is always
# at https://github.com/<owner>/<repo>/releases/latest/download/derniere-vague.apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.6.2
  GODOT_RELEASE: 4.6.2-stable

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and the export templates
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/$GODOT_RELEASE"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_RELEASE}_linux.x86_64" "$HOME/godot" && rm godot.zip
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          unzip -q templates.tpz -d tpl && mv tpl/templates/* "$dest/" && rm -rf tpl templates.tpz
          ls "$dest" | grep -i android

      - name: Point Godot at the Android SDK and Java
        run: |
          set -euo pipefail
          java_home="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          mkdir -p "$HOME/.config/godot"
          for f in editor_settings-4.tres editor_settings-4.6.tres; do
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' \
              "$ANDROID_SDK_ROOT" "$java_home" > "$HOME/.config/godot/$f"
          done
          ls "$ANDROID_SDK_ROOT/build-tools" | tail -3

      - name: Import and export
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/android/release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: dernierevague
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: dernierevague
        run: |
          set -euo pipefail
          # Every build gets a higher version code, so it installs over the previous one.
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/" export_presets.cfg
          mkdir -p build
          "$HOME/godot" --headless --import 2>&1 | tail -5
          "$HOME/godot" --headless --export-release "Android" build/derniere-vague.apk 2>&1 | tail -30
          ls -la build
          test -s build/derniere-vague.apk

      - name: Check the game logic (bot plays six rounds, including a dog round)
        run: |
          set -o pipefail
          timeout 300 "$HOME/godot" --headless --fixed-fps 60 --path . -- --bot --god --rounds=6 2>&1 \
            | grep -E "\[test\] reached|SCRIPT ERROR" | tee check.log
          grep -q "reached round 7" check.log
          ! grep -q "SCRIPT ERROR" check.log
          # Gamepad actions must work whatever device number the controller gets.
          timeout 60 "$HOME/godot" --headless --path . -- --inputtest 2>&1 | grep inputtest | tee input.log
          grep -q "\[inputtest\] OK" input.log
          # Zombies outside a window must be shootable from inside.
          timeout 60 "$HOME/godot" --headless --path . -- --windowtest 2>&1 | grep windowtest | tee window.log
          grep -q "\[windowtest\] OK" window.log
          # Save, reload from the save, compare.
          timeout 120 "$HOME/godot" --headless --path . -- --savetest 2>&1 | grep savetest | tee save.log
          grep -q "\[savetest\] OK" save.log
          # Power gates the perks, grenades kill, decoys pull zombies.
          timeout 120 "$HOME/godot" --headless --path . -- --gadgettest 2>&1 | grep gadgettest | tee gadget.log
          grep -q "\[gadgettest\] OK" gadget.log
          # Colosse, crawlers and the electric trap.
          timeout 120 "$HOME/godot" --headless --path . -- --specialtest 2>&1 | grep specialtest | tee special.log
          grep -q "\[specialtest\] OK" special.log
          # Switching weapons cancels a reload.
          timeout 60 "$HOME/godot" --headless --path . -- --swaptest 2>&1 | grep swaptest | tee swap.log
          grep -q "\[swaptest\] OK" swap.log

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ github.run_number }}"
          gh release create "$tag" build/derniere-vague.apk --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Dernière Vague — build ${{ github.run_number }}" --latest \
            --notes "APK Android (arm64). Téléchargez derniere-vague.apk et installez-le. Les builds suivants s'installent par-dessus (même signature)."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: derniere-vague
          path: build/
          retention-days: 14
